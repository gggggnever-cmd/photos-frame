<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}
/* Soft edges (2026-11-22): the picture fades into the photo behind it instead of a hard frame. Two edge
   fades are intersected, and the page is transparent, so the photo shows through the faded rim. */
#box{position:absolute;inset:0;overflow:hidden;background:#000;border-radius:18px;
  --f:9%;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--f),#000 calc(100% - var(--f)),transparent 100%),
    linear-gradient(to bottom,transparent 0,#000 calc(var(--f) * 1.6),#000 calc(100% - var(--f) * 1.6),transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
#box iframe,#p{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f1ede4;
font:16px sans-serif;text-align:center;padding:12px;box-sizing:border-box;z-index:2;text-shadow:0 1px 4px #000}</style></head>
<body><div id="msg">Loading YouTube…</div><div id="box"><div id="p"></div></div>
<script>
// YouTube's official embedded player (IFrame API), shown in a corner of the frame. Driven from Java
// through window.corner.*; reports back through the Android bridge "TV".
var player = null, apiReady = false, pending = null, volume = 60, wanted = null, mix = false, shapeOf = '', aspect = 16 / 9, zoom = 1;
function onYouTubeIframeAPIReady() { apiReady = true; if (pending) { var p = pending; pending = null; load(p.v, p.l); } }
function msg(t) { var m = document.getElementById('msg'); m.textContent = t || ''; m.style.display = t ? 'flex' : 'none'; }

// Fill the window: size the player to the video's own shape and let the window trim the overflow, so a
// 4:3 or tall video has no black side bars (2026-11-22). The shape comes from YouTube's oEmbed.
function fit() {
  var f = document.querySelector('#box iframe'); if (!f) return;
  var W = window.innerWidth, H = window.innerHeight, w = W, h = W / aspect;
  if (h < H) { h = H; w = H * aspect; }
  w *= zoom; h *= zoom;   // "Trim black edges": for videos with black bars inside the picture
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.style.left = (W - w) / 2 + 'px'; f.style.top = (H - h) / 2 + 'px';
}
function shape(id) {
  if (!id || id == shapeOf) return;
  shapeOf = id;
  TV.shape(id);   // the app asks YouTube's oEmbed for the video's shape and calls corner.aspect()
}
window.addEventListener('resize', fit);

// A single song keeps going: with no playlist, YouTube's mix for that song ("RD" + id) plays after it.
function load(v, l, noMix) {
  wanted = {v: v, l: l};
  if (!apiReady) { pending = wanted; return; }
  if (player) { try { player.destroy(); } catch (e) {} player = null; }
  var box = document.getElementById('box');
  box.innerHTML = '<div id="p"></div>';
  msg('Loading…');
  mix = !l && !!v && !noMix;
  var list = l || (mix ? 'RD' + v : '');
  var vars = {autoplay: 1, controls: 0, playsinline: 1, rel: 0, iv_load_policy: 3, fs: 0, disablekb: 1,
              origin: location.origin};
  if (list) { vars.list = list; vars.listType = 'playlist'; }
  var opts = {width: '100%', height: '100%', playerVars: vars,
    events: {
      onReady: function (e) { e.target.setVolume(volume); e.target.playVideo(); msg(''); fit(); report(); },
      onStateChange: function () { report(); },
      onError: function (e) {
        TV.error(e.data);
        var pl = player && player.getPlaylist && player.getPlaylist();
        if (mix && (!pl || pl.length < 2)) { load(v, '', true); return; }   // the mix didn't load: just the song
        if (pl && pl.length > 1 && player.getPlaylistIndex() < pl.length - 1) player.nextVideo();
        else msg(e.data == 101 || e.data == 150 ? 'This video can’t play outside YouTube.' : 'This video can’t play here.');
        report();
      }
    }};
  if (v) opts.videoId = v;   // an empty or undefined videoId makes YouTube refuse playlist-only links
  try {
    player = new YT.Player('p', opts);
  } catch (e) {
    TV.error(-1);
    if (mix) { load(v, '', true); return; }
    msg('YouTube couldn’t open that link.');
  }
}
function report() {
  if (!player || !player.getPlayerState) return;
  var d = player.getVideoData ? player.getVideoData() : {};
  if (d && d.video_id) shape(d.video_id);
  var list = player.getPlaylist ? player.getPlaylist() : null;
  TV.state(JSON.stringify({title: (d && d.title) || '', author: (d && d.author) || '', state: player.getPlayerState(),
    index: player.getPlaylistIndex ? player.getPlaylistIndex() : -1, count: list ? list.length : 0, volume: volume, mix: mix}));
}
window.corner = {
  load: load,
  pause: function () { if (player && player.pauseVideo) player.pauseVideo(); },
  play: function () { if (player && player.playVideo) player.playVideo(); },
  toggle: function () { if (!player || !player.getPlayerState) return; if (player.getPlayerState() == 1) player.pauseVideo(); else player.playVideo(); },
  next: function () { if (player && player.nextVideo) player.nextVideo(); },
  prev: function () { if (player && player.previousVideo) player.previousVideo(); },
  volume: function (v) { volume = Math.max(0, Math.min(100, v)); if (player && player.setVolume) { player.setVolume(volume); player.unMute(); } report(); },
  zoom: function (z) { zoom = z > 0 ? z : 1; fit(); },
  aspect: function (id, a) { if (id == shapeOf && a > 0.3 && a < 4) { aspect = a; fit(); } },
  stop: function () { if (player) { try { player.destroy(); } catch (e) {} player = null; } wanted = null; msg(''); }
};
setInterval(report, 3000);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
