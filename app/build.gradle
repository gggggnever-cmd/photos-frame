plugins { id 'com.android.application' }
android {
    namespace 'com.gary.photosframe'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gary.photosframe'
        minSdk 28
        targetSdk 34
        versionCode 49
        versionName '0.49'
        // The TV runs 32-bit ARM; leave out ML Kit's other chips (keeps the app ~30 MB smaller).
        ndk { abiFilters 'armeabi-v7a' }
    }
    buildTypes {
        // The TV's CPU is slow and debuggable builds run tight loops several times slower, so the
        // TV gets the release build. Signed with the local debug key: personal sideload, not the Play Store.
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    androidResources { noCompress 'tflite' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    // Face finding for Places only / Highlights, with the model inside the app (works offline, on the TV).
    implementation 'com.google.mlkit:face-detection:16.1.7'
    // Finds whole people (from behind, side-on, small in the scene) for Places only. Model in assets.
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
    testImplementation 'junit:junit:4.13.2'
}
