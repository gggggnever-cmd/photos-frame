plugins { id 'com.android.application' }
android {
    namespace 'com.gary.photosframe'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gary.photosframe'
        minSdk 28
        targetSdk 34
        versionCode 9
        versionName '0.9'
    }
    buildTypes {
        // The TV's CPU is slow and debuggable builds run tight loops several times slower, so the
        // TV gets the release build. Signed with the local debug key: personal sideload, not the Play Store.
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
